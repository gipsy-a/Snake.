<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake.io Black Arena</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: none;
        }
        #ui-container {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }
        .score-card {
            background: rgba(20, 20, 20, 0.8);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            pointer-events: auto;
        }
        .btn {
            background: #00e676;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.4);
        }
        canvas {
            display: block;
            background-color: #050505;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        /* Virtual Joystick / Controller HP */
        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        #joystick-knob {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #00e676 0%, #00a152 100%);
            border-radius: 50%;
            box-shadow: 0 0 12px #00e676;
            position: absolute;
        }
        #game-over-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #game-over-modal.show {
            opacity: 1;
            pointer-events: auto;
        }
        #game-over-modal h1 {
            font-size: 32px;
            color: #ff1744;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 23, 68, 0.5);
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <div class="score-card">Skor: <span id="score">0</span></div>
        <button class="btn" id="soundBtn" onclick="toggleSound()">🔊 Suara</button>
    </div>

    <!-- Layar Game -->
    <canvas id="gameCanvas"></canvas>

    <!-- Controls untuk HP -->
    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>

    <!-- Modal Game Over -->
    <div id="game-over-modal">
        <h1>GAME OVER</h1>
        <p style="margin-bottom: 20px; font-size: 18px;">Skor Akhir: <span id="finalScore">0</span></p>
        <button class="btn" onclick="restartGame()">Main Lagi</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Ukuran Canvas Responsif
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Variabel Game
        let snake = [];
        let snakeLength = 20;
        let headX, headY;
        let angle = 0; // Sudut pergerakan (radian)
        let speed = 3.5;
        let score = 0;
        let foods = [];
        let enemies = [];
        let gameRunning = false;
        let soundEnabled = true;

        // Audio System
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playEatSound() {
            if (!soundEnabled) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch(e) {}
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById("soundBtn").innerText = soundEnabled ? "🔊 Suara" : "🔇 Bisu";
        }

        // Inisialisasi Game
        function init() {
            headX = canvas.width / 2;
            headY = canvas.height / 2;
            angle = 0;
            snakeLength = 25;
            snake = [];
            
            for (let i = 0; i < snakeLength; i++) {
                snake.push({ x: headX - i * 3, y: headY });
            }

            score = 0;
            document.getElementById("score").innerText = score;
            document.getElementById("game-over-modal").classList.remove("show");

            // Generasi Makanan
            foods = [];
            for (let i = 0; i < 40; i++) spawnFood();

            // Generasi Musuh / Obstacle
            enemies = [];
            for (let i = 0; i < 5; i++) spawnEnemy();

            gameRunning = true;
            requestAnimationFrame(gameLoop);
        }

        function spawnFood() {
            foods.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 3 + 4,
                color: `hsl(${Math.random() * 360}, 100%, 60%)`,
                isApple: Math.random() < 0.2 // 20% Peluang jadi Apel
            });
        }

        function spawnEnemy() {
            enemies.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: 12,
                color: "#ff1744"
            });
        }

        // Loop Game Utama
        function gameLoop() {
            if (!gameRunning) return;

            update();
            render();

            requestAnimationFrame(gameLoop);
        }

        function update() {
            // Gerakkan Kepala Ular
            headX += Math.cos(angle) * speed;
            headY += Math.sin(angle) * speed;

            // Batas Tembok Arena (Menembus/Teleport ke sisi lawan)
            if (headX < 0) headX = canvas.width;
            if (headX > canvas.width) headX = 0;
            if (headY < 0) headY = canvas.height;
            if (headY > canvas.height) headY = 0;

            // Update posisi tubuh
            snake.unshift({ x: headX, y: headY });
            while (snake.length > snakeLength) {
                snake.pop();
            }

            // Deteksi Makan Makanan
            for (let i = foods.length - 1; i >= 0; i--) {
                let f = foods[i];
                let dist = Math.hypot(headX - f.x, headY - f.y);
                if (dist < f.radius + 10) {
                    score += f.isApple ? 20 : 5;
                    snakeLength += f.isApple ? 3 : 1;
                    document.getElementById("score").innerText = score;
                    playEatSound();
                    foods.splice(i, 1);
                    spawnFood();
                }
            }

            // Deteksi Menabrak Diri Sendiri
            for (let i = 15; i < snake.length; i++) {
                let dist = Math.hypot(headX - snake[i].x, headY - snake[i].y);
                if (dist < 8) {
                    gameOver();
                    return;
                }
            }

            // Deteksi Menabrak Musuh
            for (let e of enemies) {
                let dist = Math.hypot(headX - e.x, headY - e.y);
                if (dist < e.radius + 8) {
                    gameOver();
                    return;
                }
            }
        }

        function render() {
            // Background Hitam
            ctx.fillStyle = "#050505";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Gambar Grid Hitam Neon
            ctx.strokeStyle = "rgba(255, 255, 255, 0.03)";
            ctx.lineWidth = 1;
            const gridSize = 40;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Gambar Makanan dengan Efek Glow
            for (let f of foods) {
                ctx.shadowBlur = 10;
                ctx.shadowColor = f.color;
                ctx.fillStyle = f.color;

                if (f.isApple) {
                    // Gambar Apel
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, 7, 0, Math.PI * 2);
                    ctx.fill();
                    // Tangkai
                    ctx.strokeStyle = "#795548";
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(f.x, f.y - 7);
                    ctx.lineTo(f.x + 2, f.y - 10);
                    ctx.stroke();
                } else {
                    // Butiran Makanan Cahaya
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.shadowBlur = 0; // Reset Shadow

            // Gambar Musuh
            for (let e of enemies) {
                ctx.shadowBlur = 12;
                ctx.shadowColor = "#ff1744";
                ctx.fillStyle = e.color;
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            // Gambar Ular (Style Snake.io)
            for (let i = snake.length - 1; i >= 0; i--) {
                let seg = snake[i];
                let isHead = (i === 0);

                if (isHead) {
                    // Kepala Ular Neon
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = "#00e676";
                    ctx.fillStyle = "#00e676";
                    ctx.beginPath();
                    ctx.arc(seg.x, seg.y, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // Mata Ular
                    ctx.fillStyle = "#ffffff";
                    let eyeOffset = 4;
                    let eyeX1 = seg.x + Math.cos(angle - 0.5) * eyeOffset;
                    let eyeY1 = seg.y + Math.sin(angle - 0.5) * eyeOffset;
                    let eyeX2 = seg.x + Math.cos(angle + 0.5) * eyeOffset;
                    let eyeY2 = seg.y + Math.sin(angle + 0.5) * eyeOffset;

                    ctx.beginPath();
                    ctx.arc(eyeX1, eyeY1, 3, 0, Math.PI * 2);
                    ctx.arc(eyeX2, eyeY2, 3, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = "#000000";
                    ctx.beginPath();
                    ctx.arc(eyeX1, eyeY1, 1.5, 0, Math.PI * 2);
                    ctx.arc(eyeX2, eyeY2, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Tubuh Ular Membulat Gradasi
                    let size = Math.max(3, 9 - (i / snake.length) * 3);
                    ctx.fillStyle = i % 2 === 0 ? "#00e676" : "#00b0ff";
                    ctx.beginPath();
                    ctx.arc(seg.x, seg.y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById("finalScore").innerText = score;
            document.getElementById("game-over-modal").classList.add("show");
        }

        function restartGame() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            init();
        }

        // System Control Virtual Joystick (Mobile)
        const joystickZone = document.getElementById("joystick-zone");
        const joystickKnob = document.getElementById("joystick-knob");
        let joystickActive = false;
        let touchStartX = 0, touchStartY = 0;

        joystickZone.addEventListener("touchstart", (e) => {
            joystickActive = true;
            let touch = e.touches[0];
            let rect = joystickZone.getBoundingClientRect();
            touchStartX = rect.left + rect.width / 2;
            touchStartY = rect.top + rect.height / 2;
            updateJoystick(touch.clientX, touch.clientY);
        });

        window.addEventListener("touchmove", (e) => {
            if (!joystickActive) return;
            let touch = e.touches[0];
            updateJoystick(touch.clientX, touch.clientY);
        });

        window.addEventListener("touchend", () => {
            joystickActive = false;
            joystickKnob.style.transform = `translate(0px, 0px)`;
        });

        function updateJoystick(clientX, clientY) {
            let dx = clientX - touchStartX;
            let dy = clientY - touchStartY;
            let dist = Math.hypot(dx, dy);
            let maxRadius = 35;

            if (dist > maxRadius) {
                dx = (dx / dist) * maxRadius;
                dy = (dy / dist) * maxRadius;
            }

            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            angle = Math.atan2(dy, dx);
        }

        // Kontrol Keyboard (Komputer/Laptop)
        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft") angle -= 0.2;
            if (e.key === "ArrowRight") angle += 0.2;
        });

        // Jalankan game saat halaman selesai dimuat
        window.onload = init;
    </script>
</body>
</html>
